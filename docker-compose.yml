services:
  postgres:
    image: postgres:16-alpine
    container_name: company-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: company_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: company-manager-api
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/company_manager
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: company-manager-client
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
